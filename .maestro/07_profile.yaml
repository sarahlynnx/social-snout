appId: com.socialsnout.app
name: Profile - view, edit, matching preferences
env:
  EMAIL: "emma.johnson@test.com"
  PASSWORD: "password123"
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/login.yaml
- tapOn:
    text: "Profile"
# Profile sections render
- assertVisible:
    text: "Photos"
- assertVisible:
    text: "Basics"
# Open the edit screen, then go back
- tapOn:
    text: "Edit"
- back
# Matching Preferences is further down; scroll to it, then open and save
- scrollUntilVisible:
    element:
      text: "Matching Preferences"
    direction: DOWN
- tapOn:
    text: "Matching Preferences"
- assertVisible:
    text: "Preferences"
- scrollUntilVisible:
    element:
      text: "Save Preferences"
    direction: DOWN
- tapOn:
    text: "Save Preferences"
