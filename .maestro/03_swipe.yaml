appId: com.socialsnout.app
name: Swipe deck - like and pass
env:
  EMAIL: "emma.johnson@test.com"
  PASSWORD: "password123"
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/login.yaml
# Land on the Discover/swipe tab
- tapOn:
    text: "Discover"
- runFlow: subflows/enable_location.yaml
# Wait for the deck query to resolve ("Finding pets nearby..." goes away).
- extendedWaitUntil:
    notVisible:
      text: "Finding pets nearby.*"
    timeout: 20000
# The deck either has pets (swipe-like button) or is exhausted ("No More Pets Nearby").
# Both are valid end states for a seed account; pass in either case.
- runFlow:
    when:
      visible:
        id: "swipe-like"
    commands:
      - tapOn:
          id: "swipe-pass"
      - tapOn:
          id: "swipe-like"
- runFlow:
    when:
      notVisible:
        id: "swipe-like"
    commands:
      - assertVisible:
          text: "No More Pets Nearby"
